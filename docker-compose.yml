version: "3.8"

services:
  dbnotification:
    image: postgres:16
    container_name: notification-db
    environment:
      POSTGRES_DB: notification_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12243648
    ports:
      - "5433:5432"
    volumes:
      - pgdata-notification:/var/lib/postgresql/data
    networks:
      - ms-shared

  apinotification:
    build: .
    container_name: notification-api
    depends_on:
      - dbnotification
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12243648
      SPRING_RABBITMQ_HOST: orcamento-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM:-}
    ports:
      - "8081:8080"
    networks:
      - ms-shared

volumes:
  pgdata-notification:

networks:
  ms-shared:
    external: true
